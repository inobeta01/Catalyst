# docker-compose.yml
# ---------------------------------------------------------------------------
# Updated compose file for Catalyst
# ---------------------------------------------------------------------------
version: "3.9"  # Updated to a newer version to avoid the obsolete warning

# Load environment variables from a .env file (if present)
env_file:
  - .env

services:
  phoenix:
    # Official Arize Phoenix image
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
    environment:
      - PHOENIX_API_KEY=${PHOENIX_API_KEY}
    volumes:
      - phoenix-data:/app/data

  agentops:
    # Official AgentOps image (placeholder – replace with actual tag if needed)
    image: python:3.11-slim
    ports:
      - "8000:8000"
    environment:
      - AGENTOPS_API_KEY=${AGENTOPS_API_KEY}

  langgraph:
    # Build the LangGraph workload from the local directory
    build: ./workload
    depends_on:
      - phoenix
      - agentops
    environment:
      - PHOENIX_HOST=http://phoenix:6006
      - AGENTOPS_HOST=http://agentops:8000
      - SANDBOX_TYPE=${SANDBOX_TYPE}
      - SANDBOX_API_KEY=${SANDBOX_API_KEY}
      - SANDBOX_BASE_URL=${SANDBOX_BASE_URL}
      - AGENTOPS_API_KEY=${AGENTOPS_API_KEY}

  # Optional sandbox service – replace with your chosen runtime (e2b, Docker, etc.)
  sandbox:
    image: python:3.11-slim
    environment:
      - SANDBOX_API_KEY=${SANDBOX_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
    # Expose ports or mount volumes as required by the sandbox implementation